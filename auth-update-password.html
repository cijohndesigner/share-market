
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>Set New Password | CJ Cruz Trade Tracker</title>
  <link rel="stylesheet" href="css/auth-glass.css">
</head>
<body class="auth-page">
  <div class="auth-orb one" aria-hidden="true"></div>
  <div class="auth-orb two" aria-hidden="true"></div>

  <main class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-logo" aria-hidden="true">CJ</div>
      <div>
        <div class="auth-brand-name">CJ Cruz Trade Tracker</div>
        <div class="auth-brand-sub">Your personal trading workspace</div>
      </div>
    </div>

    <section class="auth-card">
      <span class="auth-eyebrow">✦ Account recovery</span>
      <h1>Set a new password</h1>
      <p class="auth-intro">
        Enter and confirm your new password to secure your account.
      </p>

      <div class="auth-message show" id="resetMessage" role="status">
        Verifying your recovery link…
      </div>

      <form id="resetForm" hidden>
        <label class="auth-field">
          <span>New password</span>
          <input
            class="auth-input"
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="10"
            placeholder="At least 10 characters"
            required
          >
        </label>

        <label class="auth-field">
          <span>Confirm new password</span>
          <input
            class="auth-input"
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="10"
            placeholder="Enter your password again"
            required
          >
        </label>

        <button class="auth-submit" id="saveButton" type="submit">
          Save new password →
        </button>
      </form>

      <p class="auth-switch" id="backLink" hidden>
        <a class="auth-link" href="auth-login.html">Return to sign in</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    (() => {
      "use strict";

      const form = document.getElementById("resetForm");
      const message = document.getElementById("resetMessage");
      const button = document.getElementById("saveButton");
      const backLink = document.getElementById("backLink");

      let supabase;
      let recoveryVerified = false;

      function showMessage(text, type = "info") {
        message.textContent = text;
        message.className = "auth-message show " + type;
      }

      function showLoginLink() {
        backLink.hidden = false;
      }

      async function initialise() {
        supabase = window.CJ_SUPABASE;

        if (!supabase) {
          showMessage(
            "Supabase is not configured. Check js/supabase-config.js.",
            "error"
          );
          showLoginLink();
          return;
        }

        /*
         * Supabase recovery links may return tokens in the URL hash.
         * Some flows instead return a ?code=... parameter.
         */
        const url = new URL(window.location.href);
        const hash = new URLSearchParams(url.hash.slice(1));

        const errorText =
          hash.get("error_description") ||
          hash.get("error") ||
          url.searchParams.get("error_description") ||
          url.searchParams.get("error");

        if (errorText) {
          showMessage(
            "The recovery link is invalid, expired, or already used. Request a fresh reset email.",
            "error"
          );
          showLoginLink();
          return;
        }

        const code = url.searchParams.get("code");

        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(code);

          if (error) {
            showMessage(
              "Could not validate this recovery link. Request a fresh reset email.",
              "error"
            );
            showLoginLink();
            return;
          }

          url.searchParams.delete("code");
          window.history.replaceState(
            {},
            document.title,
            url.pathname + url.search
          );
        } else if (hash.get("access_token") && hash.get("refresh_token")) {
          const { error } = await supabase.auth.setSession({
            access_token: hash.get("access_token"),
            refresh_token: hash.get("refresh_token")
          });

          if (error) {
            showMessage(
              "Could not validate this recovery link. Request a fresh reset email.",
              "error"
            );
            showLoginLink();
            return;
          }

          window.history.replaceState(
            {},
            document.title,
            url.pathname + url.search
          );
        }

        /*
         * Require a recovery event from this page load. An ordinary
         * signed-in session alone must not authorize password recovery.
         */
        if (hash.get("access_token") && hash.get("refresh_token")) {
          // setSession succeeded above; the link supplied the session.
          recoveryVerified = true;
        }

        const { data: sessionData, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError || !sessionData.session) {
          showMessage(
            "No valid recovery session was found. Request a fresh reset email and open its link in this browser.",
            "error"
          );
          showLoginLink();
          return;
        }

        /*
         * For PKCE links, the code exchange above establishes the session.
         */
        if (code) {
          recoveryVerified = true;
        }

        if (!recoveryVerified) {
          showMessage(
            "Open the password-reset link from your email to verify recovery before setting a new password.",
            "error"
          );
          showLoginLink();
          return;
        }

        form.hidden = false;
        showMessage(
          "Recovery link verified. You can now set a new password.",
          "success"
        );
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!supabase || !recoveryVerified) {
          showMessage(
            "Your recovery session is not verified. Request a fresh reset email.",
            "error"
          );
          return;
        }

        const password =
          document.getElementById("newPassword").value;
        const confirm =
          document.getElementById("confirmPassword").value;

        if (password.length < 10) {
          showMessage(
            "Your password must contain at least 10 characters.",
            "error"
          );
          return;
        }

        if (password !== confirm) {
          showMessage("The passwords do not match.", "error");
          return;
        }

        button.disabled = true;
        button.textContent = "Saving…";

        try {
          const { data: sessionData, error: sessionError } =
            await supabase.auth.getSession();

          if (sessionError || !sessionData.session) {
            throw new Error(
              "Your recovery session expired. Request a fresh reset email."
            );
          }

          const { error } = await supabase.auth.updateUser({
            password
          });

          if (error) throw error;

          await supabase.auth.signOut();

          form.hidden = true;
          showMessage(
            "Password updated successfully. Sign in using your existing username and your new password.",
            "success"
          );
          showLoginLink();
        } catch (error) {
          showMessage(
            error.message || "Could not update the password.",
            "error"
          );
          button.disabled = false;
          button.textContent = "Save new password →";
        }
      });

      initialise().catch((error) => {
        showMessage(
          error.message || "Could not verify the recovery link.",
          "error"
        );
        showLoginLink();
      });
    })();
  </script>
</body>
</html>
